<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Game</title>
</head>

<body>

  <div class="game">
    <h1>🎲 LUDO</h1>

    <div class="board">

      <!-- Red Home -->
      <div class="home red-home">
        <div class="piece red"></div>
        <div class="piece red"></div>
        <div class="piece red"></div>
        <div class="piece red"></div>
      </div>

      <!-- Blue Home -->
      <div class="home blue-home">
        <div class="piece blue"></div>
        <div class="piece blue"></div>
        <div class="piece blue"></div>
        <div class="piece blue"></div>
      </div>

      <!-- Yellow Home -->
      <div class="home yellow-home">
        <div class="piece yellow"></div>
        <div class="piece yellow"></div>
        <div class="piece yellow"></div>
        <div class="piece yellow"></div>
      </div>

      <!-- Green Home -->
      <div class="home green-home">
        <div class="piece green"></div>
        <div class="piece green"></div>
        <div class="piece green"></div>
        <div class="piece green"></div>
      </div>

      <!-- Center -->
      <div class="center">
        <span>🏆</span>
      </div>

    </div>

    <div class="controls">
      <div id="dice">🎲</div>

      <button onclick="rollDice()">
        ROLL DICE
      </button>

      <p id="message">Player 1's turn</p>
    </div>

  </div>

</body>
</html>
