<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ludo Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- MENU -->
  <section id="menuScreen" class="screen active">
    <div class="menu-card">
      <div class="logo">LUDO</div>
      <p class="subtitle">Classic Board Game</p>

      <button id="computerBtn" class="menu-btn">PLAY WITH COMPUTER</button>
      <button id="multiplayerBtn" class="menu-btn">MULTIPLAYER</button>
      <button id="settingsBtn" class="menu-btn secondary">SETTINGS</button>
    </div>
  </section>


  <!-- GAME -->
  <section id="gameScreen" class="screen">

    <header class="topbar">
      <button id="backBtn" class="icon-btn">←</button>

      <div class="turn-info">
        <strong id="turnText">YOUR TURN</strong>
        <span id="modeText">You: Red + Yellow</span>
      </div>

      <button id="restartBtn" class="icon-btn">↻</button>
    </header>


    <div class="game-wrapper">

      <!-- PLAYER HAND -->
      <div class="player-hand">

        <div class="player-card you-card">
          <div class="player-avatar">👤</div>

          <div>
            <strong>YOU</strong>
            <small>RED + YELLOW</small>
          </div>

          <div class="team-pieces">
            <span class="mini red"></span>
            <span class="mini yellow"></span>
          </div>
        </div>

        <div class="player-card computer-card">
          <div class="player-avatar">🤖</div>

          <div>
            <strong>COMPUTER</strong>
            <small>GREEN + BLUE</small>
          </div>

          <div class="team-pieces">
            <span class="mini green"></span>
            <span class="mini blue"></span>
          </div>
        </div>

      </div>


      <!-- BOARD -->
      <div class="board-area">

        <div id="board" class="board">

          <!-- RED HOME -->
          <div class="home red-home">
            <div class="home-title">RED</div>

            <div class="home-yard">
              <button class="home-piece red-piece" data-color="red" data-piece="0"></button>
              <button class="home-piece red-piece" data-color="red" data-piece="1"></button>
              <button class="home-piece red-piece" data-color="red" data-piece="2"></button>
              <button class="home-piece red-piece" data-color="red" data-piece="3"></button>
            </div>
          </div>


          <!-- GREEN HOME -->
          <div class="home green-home">
            <div class="home-title">GREEN</div>

            <div class="home-yard">
              <button class="home-piece green-piece" data-color="green" data-piece="0"></button>
              <button class="home-piece green-piece" data-color="green" data-piece="1"></button>
              <button class="home-piece green-piece" data-color="green" data-piece="2"></button>
              <button class="home-piece green-piece" data-color="green" data-piece="3"></button>
            </div>
          </div>


          <!-- BLUE HOME -->
          <div class="home blue-home">
            <div class="home-title">BLUE</div>

            <div class="home-yard">
              <button class="home-piece blue-piece" data-color="blue" data-piece="0"></button>
              <button class="home-piece blue-piece" data-color="blue" data-piece="1"></button>
              <button class="home-piece blue-piece" data-color="blue" data-piece="2"></button>
              <button class="home-piece blue-piece" data-color="blue" data-piece="3"></button>
            </div>
          </div>


          <!-- YELLOW HOME -->
          <div class="home yellow-home">
            <div class="home-title">YELLOW</div>

            <div class="home-yard">
              <button class="home-piece yellow-piece" data-color="yellow" data-piece="0"></button>
              <button class="home-piece yellow-piece" data-color="yellow" data-piece="1"></button>
              <button class="home-piece yellow-piece" data-color="yellow" data-piece="2"></button>
              <button class="home-piece yellow-piece" data-color="yellow" data-piece="3"></button>
            </div>
          </div>


          <!-- PATH CELLS -->
          <div id="pathLayer"></div>


          <!-- CENTER DICE -->
          <button id="dice" class="center-dice" aria-label="Roll dice">
            <span id="diceNumber">1</span>
          </button>

        </div>

      </div>


      <!-- GAME INFO -->
      <div class="game-info">

        <div class="dice-message">
          <span id="diceMessage">Tap the dice to roll</span>
        </div>

        <div class="stats">

          <div class="stat">
            <span class="stat-label">ROLL</span>
            <strong id="rollValue">-</strong>
          </div>

          <div class="stat">
            <span class="stat-label">RED</span>
            <strong id="redFinished">0/4</strong>
          </div>

          <div class="stat">
            <span class="stat-label">YELLOW</span>
            <strong id="yellowFinished">0/4</strong>
          </div>

          <div class="stat">
            <span class="stat-label">COMPUTER</span>
            <strong id="computerFinished">0/8</strong>
          </div>

        </div>

      </div>

    </div>
  </section>


  <!-- WIN MODAL -->
  <div id="winModal" class="modal">
    <div class="modal-box">

      <div id="winnerIcon" class="winner-icon">🏆</div>

      <h2 id="winnerTitle">YOU WIN!</h2>

      <p id="winnerMessage">
        Congratulations!
      </p>

      <button id="playAgainBtn" class="modal-btn">
        PLAY AGAIN
      </button>

      <button id="menuBtn" class="modal-btn secondary">
        MAIN MENU
      </button>

    </div>
  </div>


  <!-- SETTINGS -->
  <div id="settingsModal" class="modal">
    <div class="modal-box">

      <h2>SETTINGS</h2>

      <label class="setting-row">
        <span>Sound</span>
        <input id="soundToggle" type="checkbox" checked>
      </label>

      <button id="closeSettings" class="modal-btn">
        DONE
      </button>

    </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
