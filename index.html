<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naija Ludo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       MAIN MENU
  ========================== -->

  <section id="menuScreen" class="screen menu-screen">

    <div class="top-social">
      <div class="social apple"></div>
      <div class="social facebook">f</div>
      <div class="social like">♥</div>
    </div>

    <div class="logo">
      <div>Naija</div>
      <span>Ludo</span>
    </div>

    <div class="floating-dice">
      <div class="small-die">⚄</div>
      <div class="small-die">⚂</div>
      <div class="small-die">⚅</div>
    </div>

    <div class="menu-buttons">

      <button class="menu-circle" id="settingsBtn">
        ⚙
      </button>

      <button class="menu-circle big-play" id="computerModeBtn">
        🎮
      </button>

      <button class="menu-circle" id="multiplayerModeBtn">
        ➜
      </button>

    </div>

    <div class="menu-labels">
      <span>Settings</span>
      <span>Play</span>
      <span>Multiplayer</span>
    </div>

    <div class="menu-ground">
      <div class="road"></div>
      <div class="grass-text">Naija</div>
      <div class="grass-text right">Ludo</div>
    </div>

  </section>


  <!-- =========================
       GAME SCREEN
  ========================== -->

  <section id="gameScreen" class="screen game-screen hidden">

    <div class="game-top">

      <button class="round-control" id="menuBtn">
        ☰
      </button>

      <div class="score-box">
        <div id="myScore">Me: 0</div>
        <div id="opponentScore">Opponent: 0</div>
      </div>

      <button class="round-control sound-button" id="soundBtn">
        🔊
      </button>

    </div>


    <!-- HAND INDICATOR -->

    <div class="hand-area">
      <div class="hand">
        <span>☝</span>
        <strong id="handText">Your Turn</strong>
      </div>
    </div>


    <!-- BOARD -->

    <div class="board-wrapper">

      <div class="board" id="board">

        <!-- TOP LEFT -->
        <div class="home-area green-home">
          <div class="player-title">Opponent</div>

          <div class="avatar green-avatar">👩🏽</div>

          <div class="home-piece green-piece p1"
               data-color="green"
               data-piece="0"></div>

          <div class="home-piece green-piece p2"
               data-color="green"
               data-piece="1"></div>

          <div class="home-piece green-piece p3"
               data-color="green"
               data-piece="2"></div>

          <div class="home-piece green-piece p4"
               data-color="green"
               data-piece="3"></div>
        </div>


        <!-- TOP RIGHT -->
        <div class="home-area yellow-home">
          <div class="player-title">Player 2</div>

          <div class="avatar yellow-avatar">👨🏽</div>

          <div class="home-piece yellow-piece p1"
               data-color="yellow"
               data-piece="0"></div>

          <div class="home-piece yellow-piece p2"
               data-color="yellow"
               data-piece="1"></div>

          <div class="home-piece yellow-piece p3"
               data-color="yellow"
               data-piece="2"></div>

          <div class="home-piece yellow-piece p4"
               data-color="yellow"
               data-piece="3"></div>
        </div>


        <!-- BOTTOM LEFT -->
        <div class="home-area red-home">
          <div class="player-title">Me</div>

          <div class="avatar red-avatar">👨🏽</div>

          <div class="home-piece red-piece p1"
               data-color="red"
               data-piece="0"></div>

          <div class="home-piece red-piece p2"
               data-color="red"
               data-piece="1"></div>

          <div class="home-piece red-piece p3"
               data-color="red"
               data-piece="2"></div>

          <div class="home-piece red-piece p4"
               data-color="red"
               data-piece="3"></div>
        </div>


        <!-- BOTTOM RIGHT -->
        <div class="home-area blue-home">
          <div class="player-title">Player 3</div>

          <div class="avatar blue-avatar">👩🏽</div>

          <div class="home-piece blue-piece p1"
               data-color="blue"
               data-piece="0"></div>

          <div class="home-piece blue-piece p2"
               data-color="blue"
               data-piece="1"></div>

          <div class="home-piece blue-piece p3"
               data-color="blue"
               data-piece="2"></div>

          <div class="home-piece blue-piece p4"
               data-color="blue"
               data-piece="3"></div>
        </div>


        <!-- CENTER BOARD -->
        <div class="center-area">

          <div class="center-decoration"></div>

          <div class="dice-container">

            <button class="dice red-dice" id="dice1">
              <span>●</span>
            </button>

            <button class="dice red-dice" id="dice2">
              <span>●</span>
            </button>

          </div>

        </div>


        <!-- PATH CELLS -->

        <div class="path-cell green-path c1"></div>
        <div class="path-cell green-path c2"></div>
        <div class="path-cell green-path c3"></div>
        <div class="path-cell green-path c4"></div>
        <div class="path-cell green-path c5"></div>

        <div class="path-cell yellow-path c6"></div>
        <div class="path-cell yellow-path c7"></div>
        <div class="path-cell yellow-path c8"></div>
        <div class="path-cell yellow-path c9"></div>
        <div class="path-cell yellow-path c10"></div>

        <div class="path-cell blue-path c11"></div>
        <div class="path-cell blue-path c12"></div>
        <div class="path-cell blue-path c13"></div>
        <div class="path-cell blue-path c14"></div>
        <div class="path-cell blue-path c15"></div>

        <div class="path-cell red-path c16"></div>
        <div class="path-cell red-path c17"></div>
        <div class="path-cell red-path c18"></div>
        <div class="path-cell red-path c19"></div>
        <div class="path-cell red-path c20"></div>

        <div class="path-cell white-path c21"></div>
        <div class="path-cell white-path c22"></div>
        <div class="path-cell white-path c23"></div>
        <div class="path-cell white-path c24"></div>
        <div class="path-cell white-path c25"></div>

        <div class="path-cell white-path c26"></div>
        <div class="path-cell white-path c27"></div>
        <div class="path-cell white-path c28"></div>
        <div class="path-cell white-path c29"></div>
        <div class="path-cell white-path c30"></div>

      </div>

    </div>


    <!-- BOTTOM DICE COUNTERS -->

    <div class="dice-counters">

      <div class="counter blue-counter">
        <span id="blueCount">0</span>
      </div>

      <div class="counter red-counter">
        <span id="redCount">0</span>
      </div>

      <div class="counter green-counter">
        <span id="greenCount">0</span>
      </div>

    </div>


    <!-- PLAYER STATS -->

    <div class="stats">

      <div>
        <strong>Rank:</strong>
        <span id="rank">0</span>
      </div>

      <div>
        <strong>Wins:</strong>
        <span id="wins">0</span>
      </div>

    </div>


    <!-- ROLL BUTTON -->

    <button id="rollBtn" class="roll-button">
      ROLL DICE
    </button>


    <!-- MODE LABEL -->

    <div class="mode-label" id="modeLabel">
      You vs Computer
    </div>

  </section>


  <!-- =========================
       WIN MODAL
  ========================== -->

  <div class="modal hidden" id="winnerModal">

    <div class="modal-card">

      <div class="winner-icon">🏆</div>

      <h2 id="winnerText">
        You Win!
      </h2>

      <p>
        Congratulations!
      </p>

      <button id="playAgainBtn">
        Play Again
      </button>

      <button id="backMenuBtn">
        Main Menu
      </button>

    </div>

  </div>


  <!-- =========================
       SETTINGS MODAL
  ========================== -->

  <div class="modal hidden" id="settingsModal">

    <div class="modal-card">

      <h2>Settings</h2>

      <label class="setting-row">
        <span>Sound</span>
        <input type="checkbox" id="soundToggle" checked>
      </label>

      <button id="closeSettings">
        Close
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
